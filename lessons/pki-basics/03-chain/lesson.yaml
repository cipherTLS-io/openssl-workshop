id: pki-basics/03-chain
versions: ["3.5", "4.1"]
cites:
  - page: openssl-verify
    section: OPTIONS
    option: -untrusted
  - page: openssl-verify
    section: OPTIONS
    option: -CAfile
goal: verify a leaf certificate against the root while supplying the intermediate separately, the way a client that only trusts the root would
setup:
  - openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout root.key -out root.pem -subj /CN=Root -days 30 -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
  - openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout int.key -out int.csr -subj /CN=Intermediate
  - printf 'basicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign\n' > ca.ext
  - openssl x509 -req -in int.csr -CA root.pem -CAkey root.key -out int.pem -days 30 -extfile ca.ext
  - openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout leaf.key -out leaf.csr -subj /CN=leaf.test
  - openssl x509 -req -in leaf.csr -CA int.pem -CAkey int.key -out leaf.pem -days 30
# Draft M0 schema; author validation and learner assessment are separate.
prerequisites:
  - Read PEM certificate subjects and issuers.
  - Distinguish a trust anchor from an intermediate certificate.
objective: Build the untrusted intermediate bundle required to verify the supplied leaf using only the root as the trust anchor.
learner:
  task: Create submission/intermediates.pem from the supplied intermediate certificate; do not add the root or leaf.
  outputs: [submission/intermediates.pem]
  misconception: Putting the whole chain in the trusted-root input can hide an incomplete server chain.
reference_solution:
  - mkdir -p submission
  - cp int.pem submission/intermediates.pem
assessment:
  - rule: correctness/chain
    inputs:
      root: root.pem
      intermediate: submission/intermediates.pem
      leaf: leaf.pem
feedback:
  missing_submission: Create the intermediate bundle before requesting assessment.
  invalid_chain: Check the issuer relationship and keep the trusted root separate from the intermediate input.
transfer: Repeat with a different fixture and identify which certificates belong in each input.
